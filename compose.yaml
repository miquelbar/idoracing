services:
  simcoach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simcoach
    restart: unless-stopped
    ports:
      # Accessible locally and from your LAN (localhost:8501)
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:14b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60.0}
      - AI_ENABLED=${AI_ENABLED:-true}
      - SIMCOACH_DB_PATH=/app/data/simcoach.db
    volumes:
      - simcoach_data:/app/data
    # Configure access to host network services (Ollama) on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  simcoach_data:
    name: simcoach_data
