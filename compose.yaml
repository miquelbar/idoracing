services:
  idoracing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idoracing-analytics
    restart: unless-stopped
    ports:
      # Local only. The API has no authentication; use "8501:8501" to open it to your LAN.
      - "127.0.0.1:8501:8501"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.8:27b-32k}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-90.0}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_ENABLED=${AI_ENABLED:-true}
      - IDORACING_DB_PATH=/app/data/idoracing.db
    volumes:
      - idoracing_data:/app/data
    # Configure access to host network services (Ollama) on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  idoracing_data:
    name: idoracing_data
